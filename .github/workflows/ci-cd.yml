name: ci-cd

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Run backend tests
        run: pytest tests/test_api_smoke.py app/tests/test_graph_service.py -q

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend tests and build
        run: |
          npm run test:run -- --passWithNoTests
          npm run build

      - name: Run frontend lint
        continue-on-error: true
        run: npx eslint . --ext js,jsx,ts,tsx --max-warnings=0

      - name: Run frontend typecheck
        continue-on-error: true
        run: npm run typecheck

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/backend-node.Dockerfile -t heritage-backend:ci ./backend

      - name: Build frontend image
        run: docker build -f frontend/frontend.Dockerfile -t heritage-frontend:ci ./frontend